<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pal-chat phase 2 public messages</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <p class="eyebrow">pal-chat / phase 2</p>
        <h1>公共消息与 CP 增量面板</h1>
        <p class="hero-copy">
          当前页面只覆盖阶段 2 所需能力：公共消息顺序、CP revision、WebSocket 增量同步，以及前端
          optimistic 提交状态。
        </p>
      </header>

      <main class="grid">
        <section class="panel panel-accent">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Endpoint</p>
              <h2>Bootstrap</h2>
            </div>
            <button id="refresh" type="button">刷新</button>
          </div>
          <label class="field">
            <span>API Base</span>
            <input id="api-base" type="url" value="http://127.0.0.1:8000" />
          </label>
          <div class="status-row">
            <span id="status-pill" class="pill pill-pending">等待连接</span>
            <span id="generated-at" class="muted">-</span>
          </div>
          <dl class="meta-grid">
            <div>
              <dt>App</dt>
              <dd id="app-version">-</dd>
            </div>
            <div>
              <dt>Bind Host</dt>
              <dd id="bind-host">-</dd>
            </div>
            <div>
              <dt>模板数</dt>
              <dd id="template-count">0</dd>
            </div>
            <div>
              <dt>凭据摘要</dt>
              <dd id="credential-count">0</dd>
            </div>
          </dl>
          <div id="note" class="notice hidden"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">State Machine</p>
              <h2>生命周期</h2>
            </div>
          </div>
          <div id="transitions" class="chip-list"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Modules</p>
              <h2>静态注册表</h2>
            </div>
          </div>
          <div id="modules" class="card-list"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Conversation</p>
              <h2 id="conversation-title">未连接实验</h2>
            </div>
          </div>
          <p id="conversation-meta" class="muted"></p>
          <div class="state-strip">
            <span class="eyebrow">状态</span>
            <strong id="conversation-state">-</strong>
          </div>
          <form id="message-form" class="composer">
            <label class="field">
              <span>Public Message</span>
              <textarea
                id="message-input"
                rows="4"
                placeholder="输入公共消息，前端会先以 pending optimistic 状态渲染。"
              ></textarea>
            </label>
            <button type="submit">发送消息</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Timeline</p>
              <h2>消息流</h2>
            </div>
          </div>
          <div id="messages" class="message-list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
